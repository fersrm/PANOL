{% extends 'components/Layout/base.html' %}
{% block content %}
<div class="shell">
  <aside class="desktop-sidebar" aria-label="Navegación principal">
    {% include 'components/navbar/navbar_desktop.html' %}
  </aside>
  <dialog id="mobile-navigation" class="mobile-navigation" aria-label="Navegación principal">
    <button type="button" class="icon-button drawer-close" data-close-dialog aria-label="Cerrar menú">✕</button>
    {% include 'components/navbar/navbar_mobil.html' %}
  </dialog>
  <div class="shell-content">
    <header class="topbar">
      <button type="button" class="icon-button mobile-menu-button" data-open-dialog="mobile-navigation" aria-controls="mobile-navigation" aria-expanded="false" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="topbar-label">Tu espacio de trabajo</span>
      {% include 'components/header/header.html' %}
    </header>
    <main class="site-page-main">{% block content_main %}{% endblock %}</main>
  </div>
</div>
{% endblock %}
