name: CI Django

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias verificadas
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: Comprobar configuración
        run: python manage.py check --settings=core.test_settings

      - name: Detectar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run --settings=core.test_settings

      - name: Ejecutar pruebas aisladas
        run: python manage.py test UsuarioApp homeApp PanolApp --noinput --settings=core.test_settings
