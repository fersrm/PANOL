{% if objetos.has_other_pages %}<nav class="panol-toolbar" aria-label="Paginación"><span>Página {{ objetos.number }} de {{ objetos.paginator.num_pages }}</span>{% if objetos.has_previous %}<a class="button secondary" href="{% querystring page=objetos.previous_page_number %}">Anterior</a>{% endif %}{% if objetos.has_next %}<a class="button secondary" href="{% querystring page=objetos.next_page_number %}">Siguiente</a>{% endif %}</nav>{% endif %}
